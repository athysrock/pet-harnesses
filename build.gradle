plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

def clientRunDir = providers.gradleProperty('petHarnessesClientRunDir').getOrElse('run/client')
def serverRunDir = providers.gradleProperty('petHarnessesServerRunDir').getOrElse('run/server')

loom {
    mods {
        "pet_harnesses" { sourceSet sourceSets.main }
    }
    runs {
        client { runDir clientRunDir }
        server { runDir serverRunDir }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "pet_harnesses_test"
        enableClientGameTests = false
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat = 'full' }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
